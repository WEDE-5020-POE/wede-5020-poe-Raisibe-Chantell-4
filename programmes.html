<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:;">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta http-equiv="X-Frame-Options" content="DENY">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Programmes | Ronald McDonald House Charities South Africa</title>
    <meta name="description" content="RMHC South Africa supports families with sick children through Ronald McDonald Houses, Family Rooms, and Care Mobile clinics across SA.">
    <meta name="keywords" content="Ronald McDonald House South Africa, RMHC SA, families sick children, paediatric support, Ronald McDonald Family Room, Care Mobile SA">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>RMHC South Africa Programmes</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About RMHC</a>
            <a href="programmes.html">Programmes</a>
            <a href="contact.html">Contact</a>
            <a href="donate.html">Donate</a>
        </nav>
    </header>

    <main>
        <section class="controls">
            <div class="form-group">
                <label for="searchInput">Search Programmes:</label>
                <input type="text" id="searchInput" placeholder="Search by name or location...">
            </div>
            <div class="form-group">
                <label for="categoryFilter">Filter by Type:</label>
                <select id="categoryFilter">
                    <option value="all">All Programmes</option>
                    <option value="House">Ronald McDonald House</option>
                    <option value="Family Room">Family Room</option>
                    <option value="Care Mobile">Care Mobile</option>
                </select>
            </div>
            <div class="form-group">
                <label for="sortSelect">Sort By:</label>
                <select id="sortSelect">
                    <option value="name-asc">Name: A-Z</option>
                    <option value="location">Location</option>
                    <option value="families-desc">Most Families Served</option>
                </select>
            </div>
        </section>

        <section id="programmesContainer" class="services-grid">
            <!-- JS dynamically loads RMHC programmes here -->
        </section>
    </main>

    <footer>
        <nav>
            <a href="index.html">Home</a> | 
            <a href="about.html">About RMHC</a> | 
            <a href="programmes.html">Programmes</a> | 
            <a href="contact.html">Contact</a> |
            <a href="donate.html">Donate</a>
        </nav>
        <p>&copy; 2026 Ronald McDonald House Charities South Africa</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
