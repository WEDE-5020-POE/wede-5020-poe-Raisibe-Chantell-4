<h1>Enquiry form</h1>
<!-- This is where you enter your personal inforation -->
<p>Whether it is with a question about our programs or feedback on our site.</p>
<!-- Form: methods=POST sends data securely -->
<form action="/action_page.php" method="POST">

  <!-- first name input with correct label-for and id matching -->
  <label for="fname">First name:</label><br>
  <input type="text" id="fname" name="fname" required><br><br>

  <!-- surname input with correct label-for and id matching -->
  <label for="surname">Surname:</label><br>
  <input type="text" id="surname" name="surname" required><br><br>

  <!-- email input with correct label-for and id matching -->
  <label for="email">Email:</label><br>
  <input type="email" id="email" name="email" required><br><br>

  <!-- phone number input with correct label-for and id matching -->
  <label for="cdetails">Contact details:</label><br>
  <input type="text" id="cdetails" name="cdetails" required><br><br>

   <!-- dropdown relaceses invalid type="moneytary" input-->
  <label for="Volunteer">How would you like to volunteer?</label><br>
  <select id="Volunteer" name="Volunteer">
    
    <!-- options for volunteering -->
    <option value="yes">Yes</option>
    <option value="no">No</option>
  </select><br><br>
  <label for="Time">Time:</label><br>
  <input type="time" id="Time" name="Time" value=""><br><br>

  <label for="Comment">message:</label><br>
  <input type="comment" id="comment" name="comment" value=""><br>
  
  <!-- submit button to send form data -->
  <input type="submit" value="Submit">

  <!-- reset button to clear form data -->
  <input type="reset" value="Reset">
</form>
